<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>An Bhliain</title>
<meta name="description" content="The old Irish year as a living wheel: where we are between Samhain, Imbolc, Bealtaine and Lughnasa, and how much light there is today.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>An Bhliain</h1>
  <p class="tag">The old Irish year, today</p>
</header>

<main>
  <section class="wheel-wrap" aria-labelledby="wheel-title">
    <h2 id="wheel-title" class="sr">The wheel of the year</h2>
    <svg id="wheel" viewBox="-70 24 780 596" role="img" aria-label="Wheel of the year"></svg>
    <p id="wheel-caption" class="caption"></p>
  </section>

  <section class="side">
    <article class="card light" aria-labelledby="light-h">
      <h2 id="light-h">Light in Limerick</h2>
      <p class="big" id="light-change">&nbsp;</p>
      <div class="bar" aria-hidden="true"><span id="bar-day"></span></div>
      <p class="times"><span>Sunrise <b id="rise">--:--</b></span><span>Sunset <b id="set">--:--</b></span><span>Day <b id="len">--</b></span></p>
    </article>

    <article class="card lore" id="lore" aria-live="polite"></article>

    <p class="next" id="next"></p>
  </section>
</main>

<footer>
  <p>Sketch. Every lore card is a draft awaiting review. Sunrise and sunset are worked out on this page from the date; no data is sent anywhere.</p>
</footer>
<script src="solar.js"></script>
<script src="wheel.js"></script>
<script src="app.js"></script>
</body>
</html>
